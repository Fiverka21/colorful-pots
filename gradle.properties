# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# Decompiler settings
neoForge.decompiler.maxMemory=4G
neoForge.decompiler.threads=2

# Environment Properties
minecraft_version=1.21.11
minecraft_version_range=[1.21.11, 1.21.11]
neo_version=21.11.42
loader_version_range=[1,)

# Mod Properties
mod_id=colorful_pots
mod_name=Colorful Pots
mod_license=MIT
mod_version=1.0.1
mod_group_id=com.fiverka.colorfulpots
mod_authors=fiverka
mod_description=Colorful coatings for decorated pots.
